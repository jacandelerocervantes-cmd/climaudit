[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "climaudit"
version = "0.1.0"
description = "ClimAudit backend: evidence verification for biochar carbon credits (VM0044 v1.2) on Hedera"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pypdf>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
llm = ["anthropic>=0.40"]
geo = ["h3>=4", "rasterio>=1.3"]
registry = ["openpyxl>=3.1"]
hedera = ["hiero-sdk-python>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
climaudit = ["profiles_data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
