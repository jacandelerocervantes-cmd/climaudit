# Continuous integration for ClimAudit. Runs on every push and pull request to main.
# Pattern from the platform's pipeline template: pinned runtimes, installs from lockfiles, every gate blocks the merge.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev,geo]"
      - name: Tests
        run: python -m pytest -p no:warnings

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Types, lint, translations, contrast and tests (includes the axe accessibility audit)
        run: npm run check
      - name: Build the recorded-run deployment
        run: npm run build
        env:
          CP_SNAPSHOT: "1"
      - name: Dependency audit (production, high and above)
        run: npm audit --omit=dev --audit-level=high

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No environment files or local keys are tracked
        run: |
          if git ls-files | grep -E '(^|/)\.env' | grep -vE '(^|/)\.env\.example$'; then echo "A .env file is tracked"; exit 1; fi
      - name: No private keys or tokens in tracked files
        run: |
          if git grep -nIE '(-----BEGIN [A-Z ]*PRIVATE KEY-----|302e0201[0-9a-f]{20,}|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{30,}|AKIA[0-9A-Z]{16})' -- . ':!web/package-lock.json'; then echo "Possible secret found"; exit 1; fi
      - name: No personal machine paths in tracked files
        run: |
          if git grep -nIE '(C:\\Users\\|C:/Users/|/home/[a-z]+/)' -- . ':!web/package-lock.json' ':!.github'; then echo "A local path is tracked"; exit 1; fi
      - name: The public deployment cannot hold keys
        run: |
          if git grep -nI 'NEXT_PUBLIC_' -- web/src web/*.mjs ; then echo "NEXT_PUBLIC_ variables are public; keys must stay server side"; exit 1; fi
